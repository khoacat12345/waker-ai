[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waker-ai"
version = "1.1.1"
description = "Watchdog & supervisor for AI coding agents: never let an agent sleep on the job."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "waker-ai contributors" }]
keywords = ["ai", "agent", "supervisor", "watchdog", "opencode", "claude", "aider", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
pty = [
  "pywinpty>=3.0; sys_platform == 'win32'",
  "pyte>=0.8",
]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "wheel>=0.43",
]

[project.urls]
Homepage = "https://github.com/khoacat12345/waker-ai"
Repository = "https://github.com/khoacat12345/waker-ai"
Issues = "https://github.com/khoacat12345/waker-ai/issues"

[project.scripts]
waker = "waker.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waker = ["skill_templates/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: real CLI E2E, disabled unless WAKER_LIVE_TEST=1"]

