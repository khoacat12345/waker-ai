[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waker-ai"
version = "0.1.0a1"
description = "Watchdog & supervisor for AI coding agents: never let an agent sleep on the job."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "waker-ai" }]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.scripts]
waker = "waker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waker = ["skill_templates/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
